<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Alex Filipovici</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
@font-face{font-family:"Fraunces";src:url(/assets/fonts/fraunces-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Inter";src:url(/assets/fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}
[data-theme="light"]{color-scheme:light;--bg:#F5F2EC;--ink:#0E1A2B;--muted:#4D5B6E;--accent:#0B6E83;--accent-ink:#FFFFFF;--accent-text:#0A6074;--grid:rgba(14,26,43,.05);--grid-major:rgba(14,26,43,.09)}
[data-theme="dark"]{color-scheme:dark;--bg:#0A1522;--ink:#EAF0F7;--muted:#A3B1C3;--accent:#5CC8D7;--accent-ink:#04202A;--accent-text:#7AD6E3;--grid:rgba(160,200,230,.05);--grid-major:rgba(160,200,230,.09)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 "Inter",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:160px 160px,160px 160px,32px 32px,32px 32px}
main{max-width:34rem}
.code{font:500 .8125rem/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text)}
h1{margin:1rem 0 0;font:500 clamp(2.4rem,7vw,4rem)/1 "Fraunces",Georgia,serif;letter-spacing:-.03em}
p{margin:1.25rem 0 0;color:var(--muted)}
a.btn{display:inline-flex;align-items:center;min-height:48px;margin-top:2rem;padding:.75rem 1.4rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
a.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>This page doesn't exist.</h1>
  <p>The link may be outdated or mistyped. The home page has everything: expertise, experience and how to get in touch.</p>
  <a class="btn" href="/">Back to the home page</a>
</main>
</body>
</html>
